# config.yaml (DeepSpiro & COPD-Early-Prediction 전체 파이프라인용)

data:
  demo_path:       data/DEMO_G.xpt
  smq_path:        data/SMQ_G.xpt
  rdq_path:        data/RDQ_G.xpt
  mcq_path:        data/MCQ_G.xpt
  ocq_path:        data/OCQ_G.xpt
  cotnal_path:     data/COTNAL_G.xpt
  cbc_path:        data/CBC_G.xpt
  spx_g_path:      data/SPX_G.xpt
  spxraw_g_path:   data/SPXRAW_G.sas7bdat
  smoothing_sigma: 2.0
  patch_length:    128
  batch_size:      32

ontology:
  map_path: ontology_map.yaml

output:
  checkpoint_dir: weights
  figures_dir:    figures

train:
  epochs_detection: 30
  epochs_prediction: 50
  learning_rate: 0.001
  device: cuda
  test_size: 0.2
  random_seed: 42

model:
  explainer_hidden_dim: 64
  net1d_channels: 64
  lstm_hidden_size: 64
  attention_dim: 32
  patch_length: 128        # ★ 반드시 포함!
